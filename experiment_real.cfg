# ============================================================================
# 真实红外图像盲元数据集 - 续训配置
# 从仿真数据训练的 best_model.pt 开始，在 real_image 上续训 100 轮
# ============================================================================
name: experiments_real
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: real_train
    type: PairedImageDataset
    dataroot_gt: /home/student_server/Qtt/NAFNet/real_image/train_sharp
    dataroot_lq: /home/student_server/Qtt/NAFNet/real_image/train_blur
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: real_val
    type: PairedImageDataset
    dataroot_gt: /home/student_server/Qtt/NAFNet/real_image/val_sharp
    dataroot_lq: /home/student_server/Qtt/NAFNet/real_image/val_blur
    io_backend:
      type: disk

network_g:
  type: NAFNetLocal
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

path:
  # 从仿真数据训练好的模型开始续训
  pretrain_network_g: /home/student_server/Qtt/NAFNet/experiments/models/best_model.pt
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0.
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 7600
    eta_min: !!float 1e-7

  total_iter: 7600
  warmup_iter: -1

  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

val:
  val_every: 1
  monitor: psnr
  save_img: false
  use_image: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~
  save_all_checkpoints: false

dist_params:
  backend: nccl
  port: 29500
